<!DOCTYPE html>
<html lang="zh-CN">

<style>
:root {
  --sidebar-bg: #1e293b;
  --sidebar-active: #3b82f6;
  --sidebar-text: #cbd5e1;
  --sidebar-text-active: #ffffff;
  --main-bg: #f1f5f9;
  --card-bg: #ffffff;
  --text-primary: #1e293b;
  --text-secondary: #64748b;
  --border: #e2e8f0;
  --accent: #3b82f6;
  --accent-light: #dbeafe;
  --danger: #ef4444;
  --danger-light: #fee2e2;
  --success: #22c55e;
  --success-light: #dcfce7;
  --warning: #f59e0b;
  --warning-light: #fef3c7;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:"Microsoft YaHei","Segoe UI",sans-serif; background:var(--main-bg); display:flex; height:100vh; overflow:hidden; }

/* ===== Sidebar ===== */
.sidebar { width:240px; background:var(--sidebar-bg); color:var(--sidebar-text); display:flex; flex-direction:column; flex-shrink:0; overflow-y:auto; }
.sidebar-header { padding:20px 16px; border-bottom:1px solid #334155; }
.sidebar-header h1 { font-size:18px; color:#fff; margin-bottom:4px; }
.sidebar-header p { font-size:12px; color:#94a3b8; }
.sidebar-section-title { padding:12px 16px 6px; font-size:11px; color:#64748b; text-transform:uppercase; letter-spacing:1px; }
.nav-item { display:flex; align-items:center; gap:10px; padding:10px 16px; cursor:pointer; font-size:14px; transition:all .2s; border-left:3px solid transparent; }
.nav-item:hover { background:#334155; color:#fff; }
.nav-item.active { background:var(--sidebar-active); color:var(--sidebar-text-active); border-left-color:#60a5fa; }
.nav-item .icon { width:20px; text-align:center; font-size:16px; }
.sidebar-footer { margin-top:auto; padding:16px; border-top:1px solid #334155; }
.sidebar-footer a { color:#64748b; font-size:12px; text-decoration:none; display:block; padding:6px; border-radius:6px; }
.sidebar-footer a:hover { background:#334155; color:#cbd5e1; }

/* ===== Main ===== */
.main { flex:1; display:flex; flex-direction:column; overflow:hidden; }
.topbar { height:56px; background:var(--card-bg); border-bottom:1px solid var(--border); display:flex; align-items:center; padding:0 24px; justify-content:space-between; flex-shrink:0; }
.topbar h2 { font-size:18px; color:var(--text-primary); }
.topbar .date { font-size:13px; color:var(--text-secondary); }
.content { flex:1; overflow-y:auto; padding:24px; }

/* ===== Cards ===== */
.card { background:var(--card-bg); border-radius:12px; box-shadow:0 1px 3px rgba(0,0,0,.08); padding:20px; margin-bottom:20px; }
.card-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; flex-wrap:wrap; gap:8px; }
.card-header h3 { font-size:16px; color:var(--text-primary); }
.card-header .actions { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }

/* ===== Stat Cards ===== */
.stats-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:16px; margin-bottom:24px; }
.stat-card { background:var(--card-bg); border-radius:12px; box-shadow:0 1px 3px rgba(0,0,0,.08); padding:20px; display:flex; flex-direction:column; gap:6px; }
.stat-card .label { font-size:13px; color:var(--text-secondary); }
.stat-card .value { font-size:28px; font-weight:700; color:var(--text-primary); }
.stat-card .change { font-size:12px; }
.stat-card .icon { width:40px; height:40px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:20px; margin-bottom:2px; }

/* ===== Table ===== */
.table-wrap { overflow-x:auto; }
table { width:100%; border-collapse:collapse; font-size:14px; }
th { text-align:left; padding:10px 12px; background:#f8fafc; color:var(--text-secondary); font-weight:600; border-bottom:2px solid var(--border); white-space:nowrap; }
td { padding:10px 12px; border-bottom:1px solid var(--border); color:var(--text-primary); }
tr:hover td { background:#f8fafc; }
.badge { display:inline-block; padding:3px 10px; border-radius:20px; font-size:12px; font-weight:600; }
.badge.paid { background:var(--success-light); color:var(--success); }
.badge.unpaid { background:var(--danger-light); color:var(--danger); }
.badge.low { background:var(--danger-light); color:var(--danger); }
.badge.ok { background:var(--success-light); color:var(--success); }
.badge.warn { background:var(--warning-light); color:var(--warning); }

/* ===== Buttons ===== */
.btn { padding:7px 16px; border:none; border-radius:8px; font-size:14px; cursor:pointer; transition:all .2s; display:inline-flex; align-items:center; gap:6px; }
.btn-primary { background:var(--accent); color:#fff; }
.btn-primary:hover { background:#2563eb; }
.btn-danger { background:var(--danger); color:#fff; }
.btn-danger:hover { background:#dc2626; }
.btn-sm { padding:4px 10px; font-size:12px; }
.btn-outline { background:transparent; border:1px solid var(--border); color:var(--text-primary); }
.btn-outline:hover { background:#f8fafc; }

/* ===== Form ===== */
.form-group { margin-bottom:16px; }
.form-group label { display:block; margin-bottom:6px; font-size:13px; color:var(--text-secondary); font-weight:600; }
.form-group input, .form-group select, .form-group textarea {
  width:100%; padding:9px 12px; border:1px solid var(--border); border-radius:8px; font-size:14px; font-family:inherit; outline:none; transition:border .2s;
}
.form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color:var(--accent); }
.form-row { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
.form-row3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:16px; }

/* ===== Modal ===== */
.modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,.4); display:flex; align-items:center; justify-content:center; z-index:1000; }
.modal { background:#fff; border-radius:12px; padding:24px; width:90%; max-width:520px; max-height:90vh; overflow-y:auto; }
.modal h3 { font-size:18px; margin-bottom:20px; color:var(--text-primary); }
.modal-actions { display:flex; justify-content:flex-end; gap:12px; margin-top:20px; }

/* ===== Empty State ===== */
.empty { text-align:center; padding:48px 20px; color:var(--text-secondary); }
.empty .icon { font-size:48px; margin-bottom:12px; opacity:.3; }

/* ===== Charts ===== */
.chart-container { position:relative; height:300px; }
.chart-row { display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-bottom:20px; }
@media(max-width:900px){ .chart-row{grid-template-columns:1fr;} .form-row,.form-row3{grid-template-columns:1fr;} }

/* ===== Stock level bar ===== */
.stock-bar { width:100%; height:8px; background:#e2e8f0; border-radius:4px; overflow:hidden; }
.stock-bar-fill { height:100%; border-radius:4px; transition:width .3s; }
.stock-bar-fill.high { background:var(--success); }
.stock-bar-fill.mid { background:var(--warning); }
.stock-bar-fill.low { background:var(--danger); }

/* ===== Toast ===== */
.toast { position:fixed; bottom:24px; right:24px; background:#1e293b; color:#fff; padding:12px 24px; border-radius:8px; font-size:14px; z-index:2000; animation:slideUp .3s; }
@keyframes slideUp { from{opacity:0;transform:translateY(20px);} to{opacity:1;transform:translateY(0);} }

/* ===== Filter ===== */
.filter-bar { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
.filter-bar select, .filter-bar input { padding:7px 12px; border:1px solid var(--border); border-radius:8px; font-size:14px; outline:none; }
.filter-bar select:focus, .filter-bar input:focus { border-color:var(--accent); }

/* ===== Auth ===== */
.auth-overlay { position:fixed; inset:0; background:rgba(30,41,59,.95); display:flex; align-items:center; justify-content:center; z-index:3000; }
.auth-box { background:#fff; padding:32px; border-radius:16px; width:90%; max-width:380px; text-align:center; box-shadow:0 25px 50px rgba(0,0,0,.25); }
.auth-box h2 { margin-bottom:8px; font-size:20px; }
.auth-box p { color:var(--text-secondary); font-size:14px; margin-bottom:20px; }
.auth-error { color:var(--danger); font-size:13px; min-height:20px; margin-bottom:12px; text-align:left; }
.user-info { display:flex; align-items:center; gap:12px; font-size:13px; }
#authOverlay.hidden { display:none; }

/* ===== Mobile responsive ===== */
.menu-btn { display:none; padding:6px 12px; }
.sidebar-backdrop { display:none; }
.table-wrap { -webkit-overflow-scrolling:touch; }
@media (max-width:768px) {
  body { flex-direction:column; }
  .menu-btn { display:inline-flex; }
  .sidebar { position:fixed; top:0; left:0; bottom:0; height:100vh; z-index:4000; transform:translateX(-100%); transition:transform .25s ease; }
  .sidebar.open { transform:translateX(0); box-shadow:0 0 40px rgba(0,0,0,.35); }
  .sidebar-backdrop { display:block; position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:3500; opacity:0; pointer-events:none; transition:opacity .25s; }
  .sidebar-backdrop.show { opacity:1; pointer-events:auto; }
  .main { width:100%; height:100vh; }
  .topbar { padding:8px 12px; height:auto; min-height:52px; flex-wrap:wrap; gap:6px; }
  #currentDate { display:none; }
  #userEmail { max-width:130px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .user-info { flex-wrap:wrap; gap:6px; font-size:12px; }
  .content { padding:12px; }
  .stats-grid { grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; }
  .stat-card { padding:14px; }
  .stat-card .value { font-size:22px; }
  .chart-row { grid-template-columns:1fr; }
  .form-row, .form-row3 { grid-template-columns:1fr; }
  .so-batch-row, .so-modal-row { grid-template-columns:repeat(4,minmax(0,1fr)) !important; }
  table { font-size:13px; }
  th, td { padding:8px; }
  .modal { padding:16px; }
  .btn { min-height:38px; }
}
</style>
</head>

  </div>
  <div class="content" id="content"></div>
</div>

function loadLocal() {
  const raw = localStorage.getItem(DB_KEY);
  if (raw) { try { return JSON.parse(raw); } catch(e){} }
  return null;
}
function saveLocal() {
  localStorage.setItem(DB_KEY, JSON.stringify(db));
}

function updateNextIds() {
  db.nextId.stockIn = db.stockIn.reduce((m, r) => Math.max(m, r.id || 0), 0) + 1;
  db.nextId.stockOut = db.stockOut.reduce((m, r) => Math.max(m, r.id || 0), 0) + 1;
}

async function loadFromCloud() {
  if (!_supabase || !_currentUser) return false;
  _syncing = true;
  try {
    const [{data:sin, error:e1}, {data:sout, error:e2}, {data:ac, error:e3}, {data:os, error:e4}] = await Promise.all([
      _supabase.from('stock_in').select('*').order('date',{ascending:false}),
      _supabase.from('stock_out').select('*').order('date',{ascending:false}),
      _supabase.from('actual_counts').select('*'),
      _supabase.from('opening_stock').select('*')
    ]);
    if (e1) { console.error('stock_in load error', e1); toast('入库数据加载失败'); }
    if (e2) { console.error('stock_out load error', e2); toast('出库数据加载失败'); }
    if (e3) { console.error('actual_counts load error', e3); toast('盘点数据加载失败'); }
    if (e4) { console.error('opening_stock load error', e4); toast('期初库存加载失败'); }
    db.stockIn = (sin || []).map(r => ({
      id: r.id, type: r.type, size: r.size, date: r.date,
      quantity: r.quantity, operator: r.operator, note: r.note || '',
      amount: Number(r.amount) || 0
    }));
    db.stockOut = (sout || []).map(r => ({
      id: r.id, student: r.student, type: r.type, size: r.size, date: r.date,
      quantity: r.quantity, paid: r.paid, paymentMethod: r.payment_method || '',
      operator: r.operator, note: r.note || '',
      amount: Number(r.amount) || 0
    }));
    db.actualCounts = {};
    (ac || []).forEach(r => {
      db.actualCounts[r.type + '|' + r.size] = { qty: r.qty, date: r.date, operator: r.operator };
    });
    db.openingStock = {};
    (os || []).forEach(r => {
      db.openingStock[r.type + '|' + r.size] = { qty: r.qty, date: r.date, operator: r.operator, note: r.note || '' };
    });
    updateNextIds();
    saveLocal();
    return true;
  } catch(e) {
    console.error('Cloud load failed', e);
    toast('云端同步失败，使用本地缓存');
    return false;
  } finally {
    _syncing = false;
  }
}

async function seedCloudIfEmpty() {
  if (!_supabase || !_currentUser) return;
  const { data: existing } = await _supabase.from('stock_in').select('id').limit(1);
  if (existing && existing.length > 0) return;
  const defaults = buildDefaultData();
  if (defaults.stockIn.length > 0) {
    const rows = defaults.stockIn.map(r => ({
      type: r.type, size: r.size, date: r.date, quantity: r.quantity,
      operator: r.operator, note: r.note || '', amount: r.amount || 0
    }));
    const { error } = await _supabase.from('stock_in').insert(rows);
    if (error) console.error('seed stock_in error', error);
  }
  if (Object.keys(defaults.actualCounts).length > 0) {
    const rows = Object.entries(defaults.actualCounts).map(([key, r]) => {
      const [type, size] = key.split('|');
      return { type, size, qty: r.qty, date: r.date, operator: r.operator };
    });
    const { error } = await _supabase.from('actual_counts').upsert(rows, { onConflict: 'type,size' });
    if (error) console.error('seed actual_counts error', error);
  }
  if (Object.keys(defaults.openingStock || {}).length > 0) {
    const rows = Object.entries(defaults.openingStock).map(([key, r]) => {
      const [type, size] = key.split('|');
      return { type, size, qty: r.qty, date: r.date, operator: r.operator, note: r.note || '' };
    });
    const { error } = await _supabase.from('opening_stock').upsert(rows, { onConflict: 'type,size' });
    if (error) console.error('seed opening_stock error', error);
  }
}

async function migrateLocalToCloud() {
  if (!_supabase || !_currentUser) return;
  const local = loadLocal();
  if (!local) return;
  if ((!local.stockIn || local.stockIn.length === 0) && (!local.stockOut || local.stockOut.length === 0)) return;
  if (!confirm('检测到本地有库存数据，是否上传到云端？\n（这会合并到云端现有数据）')) return;

  if (local.stockIn && local.stockIn.length > 0) {
    const rows = local.stockIn.map(r => ({
      type: r.type, size: r.size, date: r.date, quantity: r.quantity,
      operator: r.operator, note: r.note || '', amount: r.amount || 0
    }));
    const { error } = await _supabase.from('stock_in').insert(rows);
    if (error) console.error('stock_in migration error', error);
  }
  if (local.stockOut && local.stockOut.length > 0) {
    const rows = local.stockOut.map(r => ({
      student: r.student, type: r.type, size: r.size, date: r.date, quantity: r.quantity,
      paid: r.paid || false, payment_method: r.paymentMethod || '', operator: r.operator, note: r.note || '',
      amount: r.amount || 0
    }));
    const { error } = await _supabase.from('stock_out').insert(rows);
    if (error) console.error('stock_out migration error', error);
  }
  if (local.actualCounts) {
    const rows = Object.entries(local.actualCounts).map(([key, r]) => {
      const [type, size] = key.split('|');
      return { type, size, qty: r.qty, date: r.date, operator: r.operator };
    });
    if (rows.length > 0) {
      const { error } = await _supabase.from('actual_counts').upsert(rows, { onConflict: 'type,size' });
      if (error) console.error('actual_counts migration error', error);
    }
  }
  if (local.openingStock) {
    const rows = Object.entries(local.openingStock).map(([key, r]) => {
      const [type, size] = key.split('|');
      return { type, size, qty: r.qty, date: r.date, operator: r.operator, note: r.note || '' };
    });
    if (rows.length > 0) {
      const { error } = await _supabase.from('opening_stock').upsert(rows, { onConflict: 'type,size' });
      if (error) console.error('opening_stock migration error', error);
    }
  }
  toast('本地数据已上传');
}

async function initData() {
  const local = loadLocal();
  if (local) {
    db = local;
    if (!db.actualCounts) db.actualCounts = {};
    if (!db.openingStock) db.openingStock = {};
    if (!db.nextId) db.nextId = { stockIn: 1, stockOut: 1 };
    db.nextId.stockIn = db.nextId.stockIn || 1;
    db.nextId.stockOut = db.nextId.stockOut || 1;
  } else {
    db = buildDefaultData();
  }
  if (_currentUser) {
    await seedCloudIfEmpty();
    await migrateLocalToCloud();
    await loadFromCloud();
  }
}

const $ = s => document.querySelector(s);
function el(tag, attrs={}, children=[]) {
  const e = document.createElement(tag);
  Object.entries(attrs).forEach(([k,v]) => {
    if (k==='class') e.className=v;
    else if (k==='style') e.style.cssText=v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v);
  });
  children.forEach(c => { if (typeof c==='string') e.appendChild(document.createTextNode(c)); else e.appendChild(c); });
  return e;
}

const TYPES = ['衣服','裤子','鞋子'];
const SIZES = {
  // 旧款（XL/S/M/2XL/2XS 等带后缀）保留以备补录库存
  '衣服': ['110','120/XL','130','130/2XL','140','140/3XL','150','150/S','160','160/M','160/S','170L','170/L','180','180/2XL'],

};

// 计算每种 type+size 的库存
function computeInventory() {
  const map = {};
  // 汇总入库
  db.stockIn.forEach(r => {
    const key = r.type + '|' + r.size;
    if (!map[key]) map[key] = { type:r.type, size:r.size, stockIn:0, stockOut:0 };
    map[key].stockIn += r.quantity;
  });
  // 汇总出库
  db.stockOut.forEach(r => {
    const key = r.type + '|' + r.size;
    if (!map[key]) map[key] = { type:r.type, size:r.size, stockIn:0, stockOut:0 };
    map[key].stockOut += r.quantity;
  });
  // 计算剩余（应余 = 期初 + 入库 - 出库）
  const list = Object.values(map).map(item => {
    const key = item.type + '|' + item.size;
    const ac = db.actualCounts[key];
    const opening = db.openingStock[key] ? db.openingStock[key].qty : 0;
    const expected = opening + item.stockIn - item.stockOut;
    const actual = ac ? ac.qty : null;
    const diff = actual !== null ? actual - expected : null;
    return {
      ...item,
      opening,
      expected,
      remaining: expected,
      actual,
      actualDate: ac ? ac.date : null,
      actualOperator: ac ? ac.operator : null,
      diff,
    };
  });
  list.sort((a,b) => {
    if (a.type !== b.type) return TYPES.indexOf(a.type) - TYPES.indexOf(b.type);
    return a.size.localeCompare(b.size);
  });
  return list;
}

  overlay.addEventListener('click', e => { if (e.target===overlay) overlay.remove(); });
  const modal = el('div',{class:'modal'});
  const currentType = item ? item.type : '衣服';
  const currentSizes = getSizesForType(currentType);
  modal.innerHTML = `
    <h3>${id?'编辑':'添加'}入库记录</h3>
    <div class="form-row">
      <div class="form-group"><label>物品类型</label>
        <select id="si_type" onchange="updateSizeOptions('si_type','si_size')">
          ${TYPES.map(t=>`<option value="${t}" ${item&&item.type===t?'selected':''}>${t}</option>`).join('')}
        </select>
      </div>
      <div class="form-group"><label>尺寸</label>
        <select id="si_size">
          ${currentSizes.map(s=>`<option value="${s}" ${item&&item.size===s?'selected':''}>${s}</option>`).join('')}
        </select>
      </div>
    </div>
    <div class="form-row3">
      <div class="form-group"><label>入库日期</label><input id="si_date" type="date" value="${item?item.date:new Date().toISOString().slice(0,10)}"></div>
      <div class="form-group"><label>入库数量</label><input id="si_quantity" type="number" min="1" value="${item?item.quantity:''}" placeholder="如：50"></div>
      <div class="form-group"><label>购买金额（php）</label><input id="si_amount" type="number" min="0" step="0.01" value="${item&&item.amount?item.amount:''}" placeholder="如：5000"></div>
    </div>
    <div class="form-group"><label>操作人</label><input id="si_operator" value="${item?item.operator:''}" placeholder="如：陈教练"></div>
    <div class="form-group"><label>备注</label><input id="si_note" value="${item?(item.note||''):''}" placeholder="可选"></div>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="this.closest('.modal-overlay').remove()">取消</button>
      <button class="btn btn-primary" onclick="saveStockIn(${id||0}, this)">保存</button>
    </div>`;
  overlay.appendChild(modal);
  document.body.appendChild(overlay);
}

function updateSizeOptions(typeSelectId, sizeSelectId) {
  const type = document.getElementById(typeSelectId).value;
  const sizeSelect = document.getElementById(sizeSelectId);
  const sizes = getSizesForType(type);
  sizeSelect.innerHTML = sizes.map(s => `<option value="${s}">${s}</option>`).join('');
}

async function saveStockIn(id, btn) {
  const data = {
    type: document.getElementById('si_type').value,
    size: document.getElementById('si_size').value,
    date: document.getElementById('si_date').value,
    quantity: parseInt(document.getElementById('si_quantity').value) || 0,
    operator: document.getElementById('si_operator').value.trim(),
    note: document.getElementById('si_note').value.trim(),
    amount: parseFloat(document.getElementById('si_amount').value) || 0,
  };
  if (!data.quantity || !data.operator) { toast('请填写数量和操作人'); return; }
  if (id) {
    Object.assign(db.stockIn.find(s=>s.id===id), data);
    await sbUpdateStockIn(id, data);
  } else {
    data.id = db.nextId.stockIn++;
    db.stockIn.push(data);
    await sbInsertStockIn(data);
  }
  saveData();
  btn.closest('.modal-overlay').remove();
  renderView('stockin');
  toast('保存成功');
}

async function deleteStockIn(id) {
  if (!confirm('确认删除这条入库记录？\n注意：删除后剩余库存会重新计算。')) return;
  db.stockIn = db.stockIn.filter(s=>s.id!==id);
  await sbDeleteStockIn(id);
  saveData(); renderView('stockin'); toast('已删除');
}

function toggleAllStockIn(checked) {
  document.querySelectorAll('.si-check').forEach(cb => cb.checked = checked);
}

function getSelectedStockInIds() {
  return [...document.querySelectorAll('.si-check:checked')].map(cb => parseInt(cb.value));
}

async function batchDeleteStockIn() {
  const ids = getSelectedStockInIds();
  if (ids.length === 0) { toast('请先勾选要删除的入库记录'); return; }
  if (!confirm(`确认删除选中的 ${ids.length} 条入库记录？\n注意：删除后剩余库存会重新计算。`)) return;
  db.stockIn = db.stockIn.filter(s => !ids.includes(s.id));
  await sbDeleteStockInBatch(ids);
  saveData();
  renderView('stockin');
  toast(`已删除 ${ids.length} 条入库记录`);
}

async function clearAllStockIn() {
  if (db.stockIn.length === 0) { toast('当前没有入库记录'); return; }
  if (!confirm(`确认清空全部 ${db.stockIn.length} 条入库记录？\n注意：此操作不可恢复，删除后库存会重新计算。`)) return;
  const allIds = db.stockIn.map(s => s.id);
  db.stockIn = [];
  await sbDeleteStockInBatch(allIds);
  saveData();
  renderView('stockin');
  toast('已清空全部入库记录');
}

function showBatchOperatorModal() {
  const ids = getSelectedStockInIds();
  if (ids.length === 0) { toast('请先勾选要修改的记录'); return; }
  const items = db.stockIn.filter(s => ids.includes(s.id));
  const operators = [...new Set(items.map(s => s.operator))];
  const overlay = el('div',{class:'modal-overlay'});
  overlay.addEventListener('click', e => { if (e.target===overlay) overlay.remove(); });
  const modal = el('div',{class:'modal'});
  modal.innerHTML = `
    <h3>批量修改操作人</h3>
    <div style="background:#f8fafc;border-radius:8px;padding:12px 16px;margin-bottom:16px">
      <div style="display:flex;justify-content:space-between;margin-bottom:6px">
        <span style="color:var(--text-secondary)">选中记录</span>
        <span style="font-weight:700">${ids.length} 条</span>
      </div>
      <div style="display:flex;justify-content:space-between">
        <span style="color:var(--text-secondary)">当前操作人</span>
        <span>${operators.join('、')}</span>
      </div>
    </div>
    <div class="form-group"><label>新操作人</label><input id="batch_op" placeholder="如：陈教练" value="${operators[0]||''}"></div>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="this.closest('.modal-overlay').remove()">取消</button>
      <button class="btn btn-primary" onclick="saveBatchOperator(this, [${ids.join(',')}])">保存修改</button>
    </div>`;
  overlay.appendChild(modal);
  document.body.appendChild(overlay);
}

async function saveBatchOperator(btn, ids) {
  const newOp = document.getElementById('batch_op').value.trim();
  if (!newOp) { toast('请输入操作人姓名'); return; }
  let count = 0;
  for (const id of ids) {
    const item = db.stockIn.find(s => s.id === id);
    if (item) { item.operator = newOp; count++; await sbUpdateStockIn(id, item); }
  }
  saveData();
  btn.closest('.modal-overlay').remove();
  renderView('stockin');
  toast(`已修改 ${count} 条记录的操作人`);
}

// ===================== Stock Out =====================
function renderStockOut(c) {
  const totalOut = db.stockOut.reduce((a,b)=>a+b.quantity,0);
  const paidCount = db.stockOut.filter(s=>s.paid).length;
  const unpaidCount = db.stockOut.filter(s=>!s.paid).length;

  const grid = el('div',{class:'stats-grid'});
  grid.appendChild(statCard('出库总量', totalOut, '📤', `${db.stockOut.length} 笔`));
  grid.appendChild(statCard('已收款', paidCount, '✅', '笔'));
  grid.appendChild(statCard('待收款', unpaidCount, '💰', '笔'));
  c.appendChild(grid);

  const card = el('div',{class:'card'});
  card.appendChild(el('div',{class:'card-header'},[
    el('h3',{},['出库 / 领取记录']),
    el('div',{class:'actions'},[
      el('button',{class:'btn btn-danger',onclick:()=>batchDeleteStockOut()},['批量删除']),
      el('button',{class:'btn btn-primary',onclick:()=>showStockOutBatchModal()},['+ 添加领取记录'])
    ])
  ]));
  const wrap = el('div',{class:'table-wrap'});
  if (db.stockOut.length === 0) {
    wrap.appendChild(emptyState('📤','暂无出库记录'));
  } else {
    const sorted = [...db.stockOut].sort((a,b)=>b.date.localeCompare(a.date));
    wrap.innerHTML = `<table>
      <thead><tr><th style="width:32px"><input type="checkbox" id="so_selectAll" onchange="toggleAllStockOut(this.checked)"></th><th>出库日期</th><th>学生姓名</th><th>物品</th><th>尺寸</th><th>数量</th><th>金额</th><th>是否收款</th><th>收款方式</th><th>操作人</th><th>备注</th><th>操作</th></tr></thead>
      <tbody>${sorted.map(s=>`<tr>
        <td><input type="checkbox" class="so-check" value="${s.id}"></td>
        <td>${s.date}</td>
        <td style="font-weight:600">${s.student}</td>
        <td>${s.type}</td>
        <td>${s.size}</td>
        <td style="font-weight:700">${s.quantity}</td>
        <td>${s.amount>0?fmtPhp(s.amount):(getOutAmount(s)>0?fmtPhp(getOutAmount(s))+'<span style="color:var(--text-secondary);font-size:11px">(备注)</span>':'-')}</td>
        <td>${s.paid?'<span class="badge paid">已收款</span>':'<span class="badge unpaid">未收款</span>'}</td>
        <td>${s.paymentMethod||'-'}</td>
        <td>${s.operator}</td>
        <td>${s.note||'-'}</td>
        <td>
          <button class="btn btn-sm btn-outline" onclick="showStockOutModal(${s.id})">编辑</button>
          <button class="btn btn-sm btn-danger" onclick="deleteStockOut(${s.id})">删除</button>
        </td>
      </tr>`).join('')}</tbody>`;
  }
  card.appendChild(wrap);
  c.appendChild(card);
}

        <option value="Gcash" ${prefill&&prefill.paymentMethod==='Gcash'?'selected':''}>Gcash</option>

function removeStockOutModalRow(btn) {
  const wrap = document.getElementById('so_items');
  if (wrap.children.length <= 1) { toast('至少保留一行'); return; }
  btn.closest('.so-modal-row').remove();
}

async function saveStockOutMulti(editId, btn) {
  const student = document.getElementById('so_student').value.trim();
  const date = document.getElementById('so_date').value;
  const operator = document.getElementById('so_operator').value.trim();
  if (!student) { toast('请填写学生姓名'); return; }
  if (!date) { toast('请选择出库日期'); return; }
  if (!operator) { toast('请填写操作人'); return; }

  const rows = [...document.querySelectorAll('#so_items .so-modal-row')];
  const records = [];
  let rowIdx = 0;
  for (const row of rows) {
    rowIdx++;
    const rec = {
      student,
      date,
      operator,
      type: row.querySelector('.so-type').value,
      size: row.querySelector('.so-size').value,
      quantity: parseInt(row.querySelector('.so-qty').value) || 0,
      amount: parseFloat(row.querySelector('.so-amount').value) || 0,
      paid: row.querySelector('.so-paid').value === 'true',
      paymentMethod: row.querySelector('.so-paid').value === 'true' ? row.querySelector('.so-pm').value : '',
      note: row.querySelector('.so-note').value.trim(),
    };
    if (!rec.quantity) { toast(`第 ${rowIdx} 行数量无效`); return; }
    records.push(rec);
  }
  if (records.length === 0) { toast('请至少添加一件物品'); return; }

  for (let i = 0; i < records.length; i++) {
    if (i === 0 && editId) {
      Object.assign(db.stockOut.find(s => s.id === editId), records[i]);
      await sbUpdateStockOut(editId, records[i]);
    } else {
      records[i].id = db.nextId.stockOut++;
      db.stockOut.push(records[i]);
      await sbInsertStockOut(records[i]);
    }
  }
  saveData();
  btn.closest('.modal-overlay').remove();
  renderView('stockout');
  toast(editId ? '已保存修改及新增物品' : `已保存 ${records.length} 条领取记录`);
}

function updateRowSizes(typeSel) {
  const row = typeSel.closest('.so-batch-row');
  const sizeSel = row.querySelector('.so-size');

  sizeSel.innerHTML = sizes.map(s=>`<option value="${s}">${s}</option>`).join('');
}

function toggleRowPM(paidSel) {
  const row = paidSel.closest('.so-batch-row');
  const pmGroup = row.querySelector('.so-pm-group');
  const paid = paidSel.value === 'true';
  pmGroup.style.display = paid ? '' : 'none';
}

function removeStockOutRow(btn) {
  const wrap = document.getElementById('so_items');
  if (wrap.children.length <= 1) { toast('至少保留一行'); return; }
  btn.closest('.so-batch-row').remove();
}

async function saveStockOutBatch(btn) {
  const student = document.getElementById('so_student').value.trim();
  const date = document.getElementById('so_date').value;
  const operator = document.getElementById('so_operator').value.trim();
  if (!student) { toast('请填写学生姓名'); return; }
  if (!operator) { toast('请填写操作人'); return; }
  if (!date) { toast('请选择出库日期'); return; }

  const rows = document.querySelectorAll('.so-batch-row');
  const items = [];
  const inv = computeInventory();

  for (const row of rows) {
    const type = row.querySelector('.so-type').value;
    const size = row.querySelector('.so-size').value;
    const qty = parseInt(row.querySelector('.so-qty').value) || 0;
    const amount = parseFloat(row.querySelector('.so-amount').value) || 0;
    const paid = row.querySelector('.so-paid').value === 'true';
    const pm = paid ? row.querySelector('.so-pm').value : '';
    const note = row.querySelector('.so-note').value.trim();
    if (qty <= 0) { toast('数量必须大于 0'); return; }
    const match = inv.find(i => i.type===type && i.size===size);
    if (match && match.expected < qty) {
      if (!confirm(`${type} ${size} 应余 ${match.expected} 件，领取 ${qty} 件将导致库存为负，确认继续？`)) return;
    }
    items.push({ student, type, size, date, quantity: qty, amount, paid, paymentMethod: pm, operator, note });
  }

  if (items.length === 0) { toast('请至少添加一行物品'); return; }

  for (const item of items) {
    item.id = db.nextId.stockOut++;
    db.stockOut.push(item);
    await sbInsertStockOut(item);
  }
  saveData();
  btn.closest('.modal-overlay').remove();
  renderView('stockout');
  toast(`已添加 ${items.length} 条领取记录`);
}

// ===================== Inventory Detail =====================
function renderDetail(c) {
  const inv = computeInventory();
  const totalExpected = inv.reduce((a,b)=>a+b.expected,0);
  const totalActual = inv.filter(i=>i.actual!==null).reduce((a,b)=>a+b.actual,0);
  const countedCount = inv.filter(i=>i.actual!==null).length;
  const diffCount = inv.filter(i=>i.diff!==null && i.diff!==0).length;

  const grid = el('div',{class:'stats-grid'});

  grid.appendChild(statCard('应余总量', totalExpected, '📊', '件（理论）'));

  grid.appendChild(statCard('差异项', diffCount, '⚠️', diffCount>0?'需核查':'账实相符'));

  selType.innerHTML = '<option value="">全部类型</option>' + TYPES.map(t=>`<option value="${t}">${t}</option>`).join('');
  const selStatus = el('select',{id:'filterStatus',onchange:()=>filterDetail()},[]);
  selStatus.innerHTML = '<option value="">全部状态</option><option value="uncounted">未盘点</option><option value="matched">一致</option><option value="mismatch">有差异</option><option value="low">低库存</option><option value="out">缺货</option>';
  fb.appendChild(selType);
  fb.appendChild(selStatus);
  const btnBatch = el('button',{class:'btn btn-primary',onclick:()=>showBatchCountModal(inv)},['批量盘点']);
  fb.appendChild(btnBatch);
  const btnOpen = el('button',{class:'btn btn-secondary',onclick:()=>showBatchOpeningModal(inv),style:'margin-left:8px'},['期初库存录入']);
  fb.appendChild(btnOpen);
  filterBar.appendChild(fb);
  card.appendChild(filterBar);

  const wrap = el('div',{class:'table-wrap',id:'detailTableWrap'});
  renderDetailTable(wrap, inv);
  card.appendChild(wrap);
  c.appendChild(card);

  // By type summary card
  const summaryCard = el('div',{class:'card'},[el('div',{class:'card-header'},[el('h3',{},['按类型汇总'])])]);
  const sWrap = el('div',{class:'table-wrap'});
  sWrap.innerHTML = `<table>
    <thead><tr><th>类型</th><th>规格数</th><th>总入库</th><th>总出库</th><th style="background:#eff6ff">应余</th><th style="background:#f0fdf4">实余</th><th>差异</th><th>已盘点</th><th>占比</th></tr></thead>
    <tbody>${TYPES.map(t=>{
      const items = inv.filter(i=>i.type===t);
      const tin = items.reduce((a,b)=>a+b.stockIn,0);
      const tout = items.reduce((a,b)=>a+b.stockOut,0);
      const trem = items.reduce((a,b)=>a+b.expected,0);
      const tact = items.filter(i=>i.actual!==null).reduce((a,b)=>a+b.actual,0);
      const tdiff = items.filter(i=>i.diff!==null).reduce((a,b)=>a+b.diff,0);
      const counted = items.filter(i=>i.actual!==null).length;
      const totalRem = inv.reduce((a,b)=>a+b.expected,0);
      const pct = totalRem>0 ? Math.round(trem/totalRem*100) : 0;
      const diffColor = tdiff===0?'var(--success)':'var(--danger)';
      return `<tr>
        <td style="font-weight:600">${t}</td>
        <td>${items.length}</td>
        <td>${tin}</td>
        <td>${tout}</td>
        <td style="font-weight:700;background:#eff6ff">${trem}</td>
        <td style="background:#f0fdf4">${tact}</td>
        <td style="color:${diffColor};font-weight:600">${tdiff>0?'+':''}${tdiff}</td>
        <td>${counted}/${items.length}</td>
        <td>
          <div style="display:flex;align-items:center;gap:8px">
            <div class="stock-bar" style="width:80px"><div class="stock-bar-fill ${pct>50?'high':pct>20?'mid':'low'}" style="width:${pct}%"></div></div>
            <span style="font-size:12px">${pct}%</span>
          </div>
        </td>
      </tr>`;
    }).join('')}</tbody>`;

function renderDetailTable(wrap, inv) {
  if (inv.length === 0) { wrap.appendChild(emptyState('📋','暂无库存数据')); return; }
  wrap.innerHTML = `<table>
    <thead><tr>
      <th>物品</th><th>尺寸</th><th>期初</th><th>入库量</th><th>出库量</th>
      <th style="background:#eff6ff">应余</th><th style="background:#f0fdf4">实余</th><th>差异</th>
      <th>盘点日期</th><th>盘点状态</th><th>操作</th>
    </tr></thead>
    <tbody>${inv.map(i=>{
      const expectedColor = i.expected<=0?'var(--danger)':i.expected<=LOW_STOCK_THRESHOLD?'var(--warning)':'var(--text-primary)';
      const diffText = i.diff === null ? '<span style="color:var(--text-secondary)">-</span>'
        : i.diff === 0 ? '<span style="color:var(--success);font-weight:600">0</span>'
        : i.diff > 0 ? `<span style="color:var(--danger);font-weight:700">+${i.diff}</span>`
        : `<span style="color:var(--danger);font-weight:700">${i.diff}</span>`;
      const countStatus = i.actual === null
        ? '<span class="badge inactive" style="background:#f1f5f9;color:#94a3b8">未盘点</span>'
        : i.diff === 0
        ? '<span class="badge ok">一致</span>'
        : '<span class="badge warn">有差异</span>';
      const actualText = i.actual === null
        ? '<span style="color:var(--text-secondary)">未盘点</span>'
        : `<span style="font-weight:700">${i.actual}</span>`;
      return `<tr>
        <td style="font-weight:600">${i.type}</td>
        <td>${i.size}</td>
        <td>${i.opening} <button class="btn btn-sm btn-outline" onclick="showOpeningModal('${i.type}','${i.size}')" style="padding:2px 6px;font-size:11px">编辑</button></td>
        <td>${i.stockIn}</td>
        <td>${i.stockOut}</td>
        <td style="font-weight:700;color:${expectedColor};background:#eff6ff">${i.expected}</td>
        <td style="background:#f0fdf4">${actualText}</td>
        <td>${diffText}</td>
        <td style="font-size:12px;color:var(--text-secondary)">${i.actualDate||'-'}</td>
        <td>${countStatus}</td>
        <td><button class="btn btn-sm btn-outline" onclick="showActualModal('${i.type}','${i.size}')">盘点</button></td>
      </tr>`;
    }).join('')}</tbody>`;
}

function filterDetail() {
  const fType = document.getElementById('filterType').value;
  const fStatus = document.getElementById('filterStatus').value;
  let inv = computeInventory();
  if (fType) inv = inv.filter(i => i.type === fType);
  if (fStatus === 'uncounted') inv = inv.filter(i => i.actual === null);
  else if (fStatus === 'matched') inv = inv.filter(i => i.diff === 0);
  else if (fStatus === 'mismatch') inv = inv.filter(i => i.diff !== null && i.diff !== 0);
  else if (fStatus === 'low') inv = inv.filter(i => i.expected > 0 && i.expected <= LOW_STOCK_THRESHOLD);
  else if (fStatus === 'out') inv = inv.filter(i => i.expected <= 0);
  renderDetailTable(document.getElementById('detailTableWrap'), inv);
}

  modal.innerHTML = `

      <div style="display:flex;justify-content:space-between;margin-bottom:8px">

      </div>
      <div style="display:flex;justify-content:space-between;margin-bottom:8px">

      <div style="display:flex;justify-content:space-between;margin-bottom:8px">
        <span style="color:var(--text-secondary)">出库量</span>
        <span>${item.stockOut}</span>
      </div>
      <div style="display:flex;justify-content:space-between;border-top:1px solid var(--border);padding-top:8px">
        <span style="color:var(--text-secondary);font-weight:600">应余</span>
        <span style="font-weight:700;color:var(--accent)">${item.opening} + ${item.stockIn} - ${item.stockOut} = ${item.expected} 件</span>
      </div>
    </div>
    <div class="form-group"><label>实际清点数量（实余）</label><input id="ac_qty" type="number" min="0" value="${ac?ac.qty:item.expected}" placeholder="清点后实际数量"></div>
    <div class="form-row">
      <div class="form-group"><label>盘点日期</label><input id="ac_date" type="date" value="${ac?ac.date:new Date().toISOString().slice(0,10)}"></div>
      <div class="form-group"><label>操作人</label><input id="ac_operator" value="${ac?ac.operator:''}" placeholder="如：陈教练"></div>
    </div>
    <div id="diffPreview" style="margin:12px 0;padding:12px;border-radius:8px;background:#f8fafc;text-align:center">
      <span style="color:var(--text-secondary)">差异：</span>
      <span id="diffValue" style="font-weight:700">-</span>
    </div>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="this.closest('.modal-overlay').remove()">取消</button>
      <button class="btn btn-danger" onclick="clearActualCount('${type}','${size}',this)" style="background:#94a3b8">清除盘点</button>
      <button class="btn btn-primary" onclick="saveActualCount('${type}','${size}',this)">保存</button>
    </div>`;
  overlay.appendChild(modal);
  document.body.appendChild(overlay);
  const qtyInput = document.getElementById('ac_qty');
  qtyInput.addEventListener('input', () => {
    const v = parseInt(qtyInput.value);
    const d = isNaN(v) ? null : v - item.expected;
    const el = document.getElementById('diffValue');
    if (d === null) el.textContent = '-';
    else if (d === 0) { el.textContent = '0（一致）'; el.style.color = 'var(--success)'; }
    else if (d > 0) { el.textContent = `+${d}（多了${d}件）`; el.style.color = 'var(--danger)'; }
    else { el.textContent = `${d}（少了${Math.abs(d)}件）`; el.style.color = 'var(--danger)'; }
  });
  qtyInput.dispatchEvent(new Event('input'));
}

  renderView('detail');
  toast('盘点已保存');

        <td>${i.stockOut}</td>

async function saveBatchOpening(btn) {
  const date = document.getElementById('batch_os_date').value;
  const operator = document.getElementById('batch_os_operator').value.trim();
  if (!operator) { toast('请填写操作人'); return; }
  let saved = 0;
  const inputs = [...document.querySelectorAll('.batch-os-qty')];
  for (const input of inputs) {
    const v = input.value.trim();
    if (v !== '') {
      const qty = parseInt(v);
      if (!isNaN(qty) && qty >= 0) {
        db.openingStock[input.dataset.key] = { qty, date, operator, note: '' };
        const [type, size] = input.dataset.key.split('|');
        await sbUpsertOpeningStock(type, size, { qty, date, operator, note: '' });
        saved++;
      }
    }
  }
  if (saved === 0) { toast('请至少填写一项期初数量'); return; }
  saveData();
  btn.closest('.modal-overlay').remove();
  renderView('detail');
  toast(`已保存 ${saved} 项期初库存`);
}

function showBatchCountModal(inv) {

  const modal = el('div',{class:'modal'});
  modal.style.maxWidth = '650px';

  inv.forEach(i => {
    if (i.type !== currentType) {
      currentType = i.type;
      rowsHtml += `<tr><td colspan="4" style="background:#1e293b;color:#fff;font-weight:600;padding:6px 12px">${currentType}</td></tr>`;
    }
    const key = i.type + '|' + i.size;
    const ac = db.actualCounts[key];
    const actualVal = ac ? ac.qty : '';
    const diffColor = ac ? (ac.qty === i.expected ? 'var(--success)' : 'var(--danger)') : 'var(--text-secondary)';
    const diffText = ac ? (ac.qty === i.expected ? '0' : (ac.qty > i.expected ? '+' + (ac.qty - i.expected) : String(ac.qty - i.expected))) : '-';
    rowsHtml += `<tr>
      <td style="font-weight:600">${i.size}</td>
      <td>${i.opening}</td>
      <td>${i.stockIn}</td>
      <td>${i.stockOut}</td>
      <td>${i.expected}</td>
      <td><input type="number" min="0" class="batch-qty" data-key="${key}" data-expected="${i.expected}" value="${actualVal}" placeholder="清点数量" style="width:90px;padding:5px 8px;border:1px solid var(--border);border-radius:6px"></td>
      <td class="batch-diff" style="color:${diffColor};font-weight:600">${diffText}</td>
    </tr>`;
  });
  modal.innerHTML = `
    <h3>批量盘点</h3>
    <div class="form-row" style="margin-bottom:12px">
      <div class="form-group" style="margin:0"><label>盘点日期</label><input id="batch_date" type="date" value="${new Date().toISOString().slice(0,10)}"></div>
      <div class="form-group" style="margin:0"><label>操作人</label><input id="batch_operator" value="" placeholder="如：陈教练"></div>
    </div>
    <div style="max-height:400px;overflow:auto;border:1px solid var(--border);border-radius:8px;-webkit-overflow-scrolling:touch">
      <table style="width:100%">
        <thead><tr><th>尺寸</th><th>期初</th><th>入库</th><th>出库</th><th>应余</th><th>实余</th><th>差异</th></tr></thead>
        <tbody id="batchBody">${rowsHtml}</tbody>
      </table>
    </div>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="this.closest('.modal-overlay').remove()">取消</button>
      <button class="btn btn-primary" onclick="saveBatchCount(this)">保存盘点</button>
    </div>`;
  overlay.appendChild(modal);
  document.body.appendChild(overlay);
  modal.querySelectorAll('.batch-qty').forEach(input => {
    input.addEventListener('input', () => {
      const expected = parseInt(input.dataset.expected);
      const v = parseInt(input.value);
      const diffCell = input.closest('tr').querySelector('.batch-diff');
      if (isNaN(v)) { diffCell.textContent = '-'; diffCell.style.color = 'var(--text-secondary)'; }
      else if (v === expected) { diffCell.textContent = '0'; diffCell.style.color = 'var(--success)'; }
      else if (v > expected) { diffCell.textContent = '+' + (v - expected); diffCell.style.color = 'var(--danger)'; }
      else { diffCell.textContent = String(v - expected); diffCell.style.color = 'var(--danger)'; }
    });
  });
}

async function saveBatchCount(btn) {
  const date = document.getElementById('batch_date').value;
  const operator = document.getElementById('batch_operator').value.trim();
  if (!operator) { toast('请填写操作人'); return; }
  let saved = 0;
  const inputs = [...document.querySelectorAll('.batch-qty')];
  for (const input of inputs) {
    const v = input.value.trim();
    if (v !== '') {
      const qty = parseInt(v);
      if (!isNaN(qty) && qty >= 0) {
        db.actualCounts[input.dataset.key] = { qty, date, operator };
        const [type, size] = input.dataset.key.split('|');
        await sbUpsertActualCount(type, size, { qty, date, operator });
        saved++;
      }
    }
  }
  if (saved === 0) { toast('请至少填写一项实余数量'); return; }
  saveData();
  btn.closest('.modal-overlay').remove();
  renderView('detail');
  toast(`已保存 ${saved} 项盘点记录`);
}

// ===================== Financial Report =====================
function fmtPhp(n) { return '₱' + Number(n||0).toLocaleString('zh-CN',{minimumFractionDigits:0,maximumFractionDigits:2}); }
function parseAmountFromNote(note) {
  if (!note) return 0;
  const m = String(note).replace(/,/g, '').match(/(\d+(?:\.\d+)?)/);
  return m ? parseFloat(m[1]) : 0;
}
function getOutAmount(r) {
  if (r.amount && Number(r.amount) > 0) return Number(r.amount);
  return parseAmountFromNote(r.note);
}
function getInAmount(r) {
  return (r.amount && Number(r.amount) > 0) ? Number(r.amount) : 0;
}
function getReportMonths() {
  const set = new Set();
  db.stockIn.forEach(r => { if (r.date) set.add(r.date.slice(0,7)); });
  db.stockOut.forEach(r => { if (r.date) set.add(r.date.slice(0,7)); });
  set.add(new Date().toISOString().slice(0,7));
  return [...set].filter(Boolean).sort().reverse();
}

function renderReport(c) {
  const card = el('div',{class:'card'});
  const months = getReportMonths();
  const sel = el('select',{id:'reportMonth',onchange:()=>renderReportTable()});
  sel.innerHTML = months.map(m => `<option value="${m}">${m}</option>`).join('');
  card.appendChild(el('div',{class:'card-header'},[
    el('h3',{},['月度财务报表']),
    el('div',{class:'filter-bar'},[sel])
  ]));
  const hint = el('div',{style:'font-size:12px;color:var(--text-secondary);margin-top:6px;line-height:1.6'});
  hint.textContent = '说明：收款金额取自出库记录的「金额」字段，未填写金额的旧记录会尝试从备注解析（如"500php"）；入库支出取自入库记录的「购买金额」字段。';
  card.appendChild(hint);
  c.appendChild(card);
  c.appendChild(el('div',{id:'reportContainer'}));
  renderReportTable();
}

let reportChart = null;
function renderReportTable() {
  const container = document.getElementById('reportContainer');
  if (!container) return;
  const month = document.getElementById('reportMonth').value;
  const prefix = month + '-';
  const monthOut = db.stockOut.filter(s => s.date && s.date.startsWith(prefix));
  const monthIn = db.stockIn.filter(s => s.date && s.date.startsWith(prefix));
  const paidRecords = monthOut.filter(s => s.paid);
  const unpaidRecords = monthOut.filter(s => !s.paid);
  const totalIncome = paidRecords.reduce((a,b)=>a+getOutAmount(b),0);
  const totalUnpaid = unpaidRecords.reduce((a,b)=>a+getOutAmount(b),0);
  const totalExpense = monthIn.reduce((a,b)=>a+getInAmount(b),0);
  const balance = totalIncome - totalExpense;

  container.innerHTML = '';

  // Stat cards
  const grid = el('div',{class:'stats-grid'});
  grid.appendChild(statCard('当月收款总额', fmtPhp(totalIncome), '✅', `${paidRecords.length} 笔已收款`));
  grid.appendChild(statCard('当月待收款', fmtPhp(totalUnpaid), '⏳', `${unpaidRecords.length} 笔未收款`));
  grid.appendChild(statCard('当月入库支出', fmtPhp(totalExpense), '📦', `${monthIn.length} 笔入库`));
  const balSign = balance >= 0 ? '+' : '-';
  grid.appendChild(statCard('收支差额', balSign + fmtPhp(Math.abs(balance)), '⚖️', balance>=0 ? '收款 ≥ 支出' : '支出 > 收款'));
  container.appendChild(grid);

  // Balance verdict
  const verdictCard = el('div',{class:'card'});
  const balColor = balance >= 0 ? 'var(--success)' : 'var(--danger)';
  const balBg = balance >= 0 ? 'var(--success-light)' : 'var(--danger-light)';
  const verdictText = balance > 0
    ? `本月收款 ${fmtPhp(totalIncome)} ＞ 购买支出 ${fmtPhp(totalExpense)}，盈余 ${fmtPhp(balance)}`
    : balance < 0
    ? `本月购买支出 ${fmtPhp(totalExpense)} ＞ 收款 ${fmtPhp(totalIncome)}，缺口 ${fmtPhp(Math.abs(balance))}`
    : `本月收支平衡：收款 ${fmtPhp(totalIncome)} ＝ 支出 ${fmtPhp(totalExpense)}`;
  verdictCard.appendChild(el('div',{style:`padding:16px;border-radius:10px;background:${balBg};color:${balColor};font-weight:600;font-size:15px;text-align:center`},[verdictText]));
  container.appendChild(verdictCard);

  // Chart + payment method breakdown
  const chartRow = el('div',{class:'chart-row'});
  const chartCard = el('div',{class:'card'},[
    el('div',{class:'card-header'},[el('h3',{},['收支对比']), el('span',{style:'font-size:13px;color:var(--text-secondary)'},['单位：php'])])
  ]);
  chartCard.appendChild(el('div',{class:'chart-container'},[el('canvas',{id:'reportChart'})]));
  chartRow.appendChild(chartCard);

  const methodCard = el('div',{class:'card'},[el('div',{class:'card-header'},[el('h3',{},['按收款方式统计'])])]);
  const byMethod = {};
  paidRecords.forEach(s => {
    const m = s.paymentMethod || '未填写';
    if (!byMethod[m]) byMethod[m] = { count: 0, total: 0 };
    byMethod[m].count++;
    byMethod[m].total += getOutAmount(s);
  });
  const mWrap = el('div',{class:'table-wrap'});
  const methodKeys = Object.keys(byMethod);
  if (methodKeys.length === 0) {
    mWrap.appendChild(emptyState('💰','本月暂无收款记录'));
  } else {
    mWrap.innerHTML = `<table>
      <thead><tr><th>收款方式</th><th>笔数</th><th>金额</th><th>占比</th></tr></thead>
      <tbody>${methodKeys.map(m => `<tr>
        <td style="font-weight:600">${m}</td>
        <td>${byMethod[m].count}</td>
        <td style="font-weight:700">${fmtPhp(byMethod[m].total)}</td>
        <td>${totalIncome>0 ? Math.round(byMethod[m].total/totalIncome*100)+'%' : '-'}</td>
      </tr>`).join('')}</tbody>`;
  }
  methodCard.appendChild(mWrap);
  chartRow.appendChild(methodCard);
  container.appendChild(chartRow);

  // Income detail
  const incomeCard = el('div',{class:'card'},[el('div',{class:'card-header'},[el('h3',{},['当月收款明细'])])]);
  const iWrap = el('div',{class:'table-wrap'});
  if (paidRecords.length === 0) {
    iWrap.appendChild(emptyState('✅','本月暂无已收款记录'));
  } else {
    const sorted = [...paidRecords].sort((a,b)=>b.date.localeCompare(a.date));
    iWrap.innerHTML = `<table>
      <thead><tr><th>日期</th><th>学生</th><th>物品</th><th>尺寸</th><th>数量</th><th>收款方式</th><th>金额</th><th>备注</th></tr></thead>
      <tbody>${sorted.map(s=>`<tr>
        <td>${s.date}</td>
        <td style="font-weight:600">${s.student}</td>
        <td>${s.type}</td>
        <td>${s.size}</td>
        <td>${s.quantity}</td>
        <td>${s.paymentMethod||'未填写'}</td>
        <td style="font-weight:700">${getOutAmount(s)>0?fmtPhp(getOutAmount(s)):'-'}</td>
        <td>${s.note||'-'}</td>
      </tr>`).join('')}</tbody>`;
  }
  incomeCard.appendChild(iWrap);
  container.appendChild(incomeCard);

  // Expense detail
  const expenseCard = el('div',{class:'card'},[el('div',{class:'card-header'},[el('h3',{},['当月入库支出明细'])])]);
  const eWrap = el('div',{class:'table-wrap'});
  if (monthIn.length === 0) {
    eWrap.appendChild(emptyState('📦','本月暂无入库记录'));
  } else {
    const sorted = [...monthIn].sort((a,b)=>b.date.localeCompare(a.date));
    eWrap.innerHTML = `<table>
      <thead><tr><th>日期</th><th>物品</th><th>尺寸</th><th>数量</th><th>购买金额</th><th>操作人</th><th>备注</th></tr></thead>
      <tbody>${sorted.map(s=>`<tr>
        <td>${s.date}</td>
        <td style="font-weight:600">${s.type}</td>
        <td>${s.size}</td>
        <td>${s.quantity}</td>
        <td style="font-weight:700">${getInAmount(s)>0?fmtPhp(getInAmount(s)):'-'}</td>
        <td>${s.operator}</td>
        <td>${s.note||'-'}</td>
      </tr>`).join('')}</tbody>`;
  }
  expenseCard.appendChild(eWrap);
  container.appendChild(expenseCard);

  setTimeout(() => renderReportChart(totalIncome, totalUnpaid, totalExpense), 50);
}

function renderReportChart(income, unpaid, expense) {
  const ctx = document.getElementById('reportChart');
  if (!ctx) return;
  if (reportChart) reportChart.destroy();
  reportChart = new Chart(ctx, {
    type:'bar',
    data:{
      labels:['当月收款','待收款','入库支出'],
      datasets:[{ label:'金额（php）', data:[income, unpaid, expense], backgroundColor:['#22c55e','#f59e0b','#ef4444'], borderRadius:6 }]
    },
    options:{ responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}}, scales:{y:{beginAtZero:true}} }
  });
}

// ===================== Common =====================
function statCard(label, value, icon, change) {
  return el('div',{class:'stat-card'},[
    el('div',{class:'icon'},[icon]),
    el('div',{class:'label'},[label]),
    el('div',{class:'value'},[String(value)]),
    el('div',{class:'change'},[change]),
  ]);
}
function emptyState(icon, text) {
  const d = el('div',{class:'empty'});
  d.innerHTML = `<div class="icon">${icon}</div><div>${text}</div>`;
  return d;
}

  const emailSpan = document.getElementById('userEmail');

// ===================== Export / Import / Push =====================
function exportData() {
  const blob = new Blob([JSON.stringify(db, null, 2)], {type: 'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'inventory_backup_' + new Date().toISOString().slice(0,10) + '.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  toast('数据已导出');
}

function importData() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.json';
  input.addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const text = await file.text();
    try {
      const imported = JSON.parse(text);
      if (!imported.stockIn || !imported.stockOut) {
        toast('文件格式不正确，请选择库存备份文件');
        return;
      }
      const sinCount = imported.stockIn?.length || 0;
      const soutCount = imported.stockOut?.length || 0;
      const acCount = Object.keys(imported.actualCounts || {}).length;
      const osCount = Object.keys(imported.openingStock || {}).length;
      if (!confirm(`即将导入：\n入库 ${sinCount} 条\n出库 ${soutCount} 条\n盘点 ${acCount} 条\n期初库存 ${osCount} 条\n\n这将覆盖当前所有数据，确认继续？`)) return;

      db = imported;
      if (!db.actualCounts) db.actualCounts = {};
      if (!db.openingStock) db.openingStock = {};
      if (!db.nextId) db.nextId = { stockIn: 1, stockOut: 1 };
      saveData();

      if (_currentUser) {
        // Push to cloud: delete all then re-insert
        await _supabase.from('stock_in').delete().neq('id', 0);
        await _supabase.from('stock_out').delete().neq('id', 0);
        await _supabase.from('actual_counts').delete().neq('type', '');
        await _supabase.from('opening_stock').delete().neq('type', '');

        if (db.stockIn.length > 0) {
          const rows = db.stockIn.map(r => ({
            type: r.type, size: r.size, date: r.date, quantity: r.quantity,
            operator: r.operator, note: r.note || '', amount: r.amount || 0
          }));
          const { error } = await _supabase.from('stock_in').insert(rows).select();
          if (error) console.error('import stock_in error', error);
        }
        if (db.stockOut.length > 0) {
          const rows = db.stockOut.map(r => ({
            student: r.student, type: r.type, size: r.size, date: r.date, quantity: r.quantity,
            paid: r.paid || false, payment_method: r.paymentMethod || '', operator: r.operator, note: r.note || '',
            amount: r.amount || 0
          }));
          const { error } = await _supabase.from('stock_out').insert(rows).select();
          if (error) console.error('import stock_out error', error);
        }
        if (Object.keys(db.actualCounts).length > 0) {
          const rows = Object.entries(db.actualCounts).map(([key, r]) => {
            const [type, size] = key.split('|');
            return { type, size, qty: r.qty, date: r.date, operator: r.operator };
          });
          const { error } = await _supabase.from('actual_counts').upsert(rows, { onConflict: 'type,size' });
          if (error) console.error('import actual_counts error', error);
        }
        if (Object.keys(db.openingStock).length > 0) {
          const rows = Object.entries(db.openingStock).map(([key, r]) => {
            const [type, size] = key.split('|');
            return { type, size, qty: r.qty, date: r.date, operator: r.operator, note: r.note || '' };
          });
          const { error } = await _supabase.from('opening_stock').upsert(rows, { onConflict: 'type,size' });
          if (error) console.error('import opening_stock error', error);
        }
        await loadFromCloud();
      }

      renderView(currentView);
      toast('数据导入成功');
    } catch (err) {
      console.error(err);
      toast('导入失败：文件解析错误');
    }
  });
  input.click();
}

function pushToCloud() {
  if (!_currentUser) { toast('请先登录'); return; }
  const overlay = el('div',{class:'modal-overlay'});
  overlay.addEventListener('click', e => { if (e.target===overlay) overlay.remove(); });
  const modal = el('div',{class:'modal'});
  modal.innerHTML = `
    <h3>⚠️ 上传到云端（危险操作）</h3>
    <div style="background:var(--danger-light);border-left:3px solid var(--danger);padding:10px 14px;border-radius:6px;margin-bottom:14px;font-size:13px;color:#991b1b;line-height:1.7">
      此操作会<strong>先清空云端全部数据</strong>（含其他设备录入的记录），再用本机当前数据覆盖。<br>
      日常使用无需此操作，仅在迁移旧设备数据时使用。
    </div>
    <div style="background:#f8fafc;border-radius:8px;padding:12px 16px;margin-bottom:16px;font-size:13px">
      <div style="display:flex;justify-content:space-between;margin-bottom:6px"><span style="color:var(--text-secondary)">将上传入库记录</span><span style="font-weight:700">${db.stockIn.length} 条</span></div>
      <div style="display:flex;justify-content:space-between;margin-bottom:6px"><span style="color:var(--text-secondary)">将上传出库记录</span><span style="font-weight:700">${db.stockOut.length} 条</span></div>
      <div style="display:flex;justify-content:space-between;margin-bottom:6px"><span style="color:var(--text-secondary)">将上传盘点记录</span><span style="font-weight:700">${Object.keys(db.actualCounts).length} 条</span></div>
      <div style="display:flex;justify-content:space-between"><span style="color:var(--text-secondary)">将上传期初库存</span><span style="font-weight:700">${Object.keys(db.openingStock).length} 条</span></div>
    </div>
    <div class="form-group"><label>如确认覆盖，请输入「确认」二字</label><input id="push_confirm_text" placeholder="确认" autocomplete="off"></div>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="this.closest('.modal-overlay').remove()">取消</button>
      <button class="btn btn-danger" onclick="doPushToCloud(this)">确认覆盖云端</button>
    </div>`;
  overlay.appendChild(modal);
  document.body.appendChild(overlay);
  document.getElementById('push_confirm_text').focus();
}

async function doPushToCloud(btn) {
  const txt = document.getElementById('push_confirm_text').value.trim();
  if (txt !== '确认') { toast('请输入「确认」二字后才能执行'); return; }
  btn.disabled = true;
  btn.textContent = '上传中…';
  try {
    await _supabase.from('stock_in').delete().neq('id', 0);
    await _supabase.from('stock_out').delete().neq('id', 0);
    await _supabase.from('actual_counts').delete().neq('type', '');
    await _supabase.from('opening_stock').delete().neq('type', '');

    if (db.stockIn.length > 0) {
      const rows = db.stockIn.map(r => ({
        type: r.type, size: r.size, date: r.date, quantity: r.quantity,
        operator: r.operator, note: r.note || '', amount: r.amount || 0
      }));
      const { error } = await _supabase.from('stock_in').insert(rows);
      if (error) { console.error(error); toast('入库上传失败'); return; }
    }
    if (db.stockOut.length > 0) {
      const rows = db.stockOut.map(r => ({
        student: r.student, type: r.type, size: r.size, date: r.date, quantity: r.quantity,
        paid: r.paid || false, payment_method: r.paymentMethod || '', operator: r.operator, note: r.note || '',
        amount: r.amount || 0
      }));
      const { error } = await _supabase.from('stock_out').insert(rows);
      if (error) { console.error(error); toast('出库上传失败'); return; }
    }
    if (Object.keys(db.actualCounts).length > 0) {
      const rows = Object.entries(db.actualCounts).map(([key, r]) => {
        const [type, size] = key.split('|');
        return { type, size, qty: r.qty, date: r.date, operator: r.operator };
      });
      const { error } = await _supabase.from('actual_counts').upsert(rows, { onConflict: 'type,size' });
      if (error) { console.error(error); toast('盘点上传失败'); return; }
    }
    if (Object.keys(db.openingStock).length > 0) {
      const rows = Object.entries(db.openingStock).map(([key, r]) => {
        const [type, size] = key.split('|');
        return { type, size, qty: r.qty, date: r.date, operator: r.operator, note: r.note || '' };
      });
      const { error } = await _supabase.from('opening_stock').upsert(rows, { onConflict: 'type,size' });
      if (error) { console.error(error); toast('期初库存上传失败'); return; }
    }
    await loadFromCloud();
    renderView(currentView);
    toast('本地数据已上传到云端');
    btn.closest('.modal-overlay').remove();
  } finally {
    btn.disabled = false;
    btn.textContent = '确认覆盖云端';
  }
}

// Date display
const now = new Date();
const weekdays = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
$('#currentDate').textContent = `${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日 ${weekdays[now.getDay()]}`;

// Initial render
(async function boot() {
  await checkAuthOnLoad();
  renderDashboard($('#content'));
})();
</script>
